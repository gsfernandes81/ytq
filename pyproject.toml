[project]
name = "ytq"
version = "0.2.0"
description = "Search and queue videos for the expiring-quota download queue"
requires-python = ">=3.11"
# Deliberately empty. ytq shells out to the yt-dlp *binary* on PATH rather
# than importing it, and everything else is stdlib. The queue itself — and
# expire_runner, whose portal figures the confirm screens quote — is reached
# as the dlq CHECKOUT (~/dlq or $EXPIRE_HOME), never as an installed package,
# so installing this pulls nothing from the internet.
dependencies = []

[project.scripts]
# It resolves the queue root (the dlq checkout) rather than trusting
# __file__, so an installed copy still queues into the real queue.
ytq = "ytq:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat sibling modules, not a package: queue items import ytdl_item by bare
# name off the path the item spells, so both land on sys.path as one unit.
only-include = [
    "ytq.py",
    "ytdl_item.py",
]
sources = ["."]
dev-mode-dirs = ["."]

# Two groups, not one — the or3 repo's uv plan (docs/uv-dev-env.md there),
# applied here. `uv sync` installs dev (pytest is pure Python and installs
# anywhere, the phone included); lint is separate because a plain sync must
# NOT drag ruff onto a machine that has it natively — Termux ships a native
# aarch64 ruff, and uv cannot install ruff on Android (neither manylinux nor
# musllinux). The pin is Termux's own version, so a lint count measured in
# the container describes what the phone will see.
[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pyte>=0.8.2",
    "pytest>=8",
]
lint = ["ruff==0.16.4"]
mutants = [
    "poodle>=1.3.4",
]

# The suite lives in tests/ and imports the modules by bare name off the repo
# root, which is also how a queue item imports ytdl_item — so the import path
# under test is the one that runs on the phone.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The pty-driven screen tests, so they can be run — or left out — as a group.
markers = ["tui: drives the curses screens under a pty"]
